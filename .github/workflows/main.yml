name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: MiniLiveStrip-VST3-Windows
          path: build/MiniLiveStrip_artefacts/Release/VST3/
          retention-days: 3
          if-no-files-found: error
